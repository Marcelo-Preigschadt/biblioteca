name: Manter Supabase ativo

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        run: |
          for tentativa in 1 2 3; do
            if curl --fail --silent --show-error \
              "https://bpvkclssbaohjewcunji.supabase.co/functions/v1/biblioteca-maintenance/keepalive" >/dev/null; then
              exit 0
            fi
            sleep 20
          done
          exit 1
