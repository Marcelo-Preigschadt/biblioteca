name: Backup semanal

on:
  schedule:
    - cron: "15 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar backup lógico
        run: |
          mkdir -p backups/database
          arquivo="backups/database/biblioteca-$(date -u +%Y-%m-%d).json.enc"
          for tentativa in 1 2 3; do
            if curl --fail --silent --show-error \
              "https://bpvkclssbaohjewcunji.supabase.co/functions/v1/biblioteca-maintenance/backup" \
              --output "${arquivo}"; then
              break
            fi
            sleep 20
          done
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["format"]=="biblioteca-backup-v1" and d["algorithm"]=="AES-256-GCM"' "${arquivo}"
          find backups/database -type f -name '*.enc' -mtime +70 -delete
      - name: Salvar backup criptografado
        run: |
          git config user.name "biblioteca-backup[bot]"
          git config user.email "biblioteca-backup[bot]@users.noreply.github.com"
          git add backups/database
          git diff --cached --quiet && exit 0
          git commit -m "backup: banco $(date -u +%Y-%m-%d)"
          git push
      - name: Arquivar código
        uses: actions/upload-artifact@v4
        with:
          name: biblioteca-codigo-${{ github.run_number }}
          path: |
            .
            !backups/database
          retention-days: 90
