name: Backup semanal

on:
  schedule:
    - cron: "15 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar PostgreSQL
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Gerar backup lógico
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          test -n "${SUPABASE_DB_URL}"
          test -n "${BACKUP_ENCRYPTION_KEY}"
          mkdir -p backups/database
          arquivo="backups/database/biblioteca-$(date -u +%Y-%m-%d).tar.gz.enc"
          supabase db dump --db-url "${SUPABASE_DB_URL}" --data-only --use-copy --file backup-dados.sql
          supabase db dump --db-url "${SUPABASE_DB_URL}" --file backup-schema.sql
          tar -czf backup.tar.gz backup-schema.sql backup-dados.sql
          python -m pip install --quiet cryptography
          python scripts/encrypt_backup.py backup.tar.gz "${arquivo}"
          rm backup-schema.sql backup-dados.sql
          rm backup.tar.gz
          find backups/database -type f -name '*.enc' -mtime +70 -delete
      - name: Salvar backup criptografado
        run: |
          git config user.name "biblioteca-backup[bot]"
          git config user.email "biblioteca-backup[bot]@users.noreply.github.com"
          git add backups/database
          git diff --cached --quiet && exit 0
          git commit -m "backup: banco $(date -u +%Y-%m-%d)"
          git push
      - name: Arquivar código
        uses: actions/upload-artifact@v4
        with:
          name: biblioteca-codigo-${{ github.run_number }}
          path: |
            .
            !backups/database
          retention-days: 90
